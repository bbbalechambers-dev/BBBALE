# Cloudflare Workers & D1 Configuration for B. B. BALE & CO Chambers Law Firm Management System
name = "bbbale-chambers-rebuild-staging"
main = "src/worker.ts"
compatibility_date = "2026-10-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Primary D1 Database Binding for the Law Firm Management System
[[d1_databases]]
binding = "CHAMBERS_DB"
database_name = "REPLACE_WITH_VERIFIED_EXISTING_DATABASE_NAME"
database_id = "REPLACE_WITH_VERIFIED_EXISTING_D1_DATABASE_ID"

# Fallback alias binding for backward compatibility
[[d1_databases]]
binding = "DB"
database_name = "REPLACE_WITH_VERIFIED_EXISTING_DATABASE_NAME"
database_id = "REPLACE_WITH_VERIFIED_EXISTING_D1_DATABASE_ID"

[vars]
NODE_ENV = "production"
ENABLE_CLOUDSQL = "false"
